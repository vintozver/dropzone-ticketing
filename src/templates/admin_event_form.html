{% extends "base.html" %}
{% block title %}Add event{% endblock %}
{% block content %}
  <h1>Add event</h1>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Date <input name="date" type="date" required value="{{ values.date|default('') }}"></label>
    <label>Times (one per line) <textarea name="times" required placeholder="09:00&#10;11:30">{{ values.times|default('') }}</textarea></label>
    <label>Duration (minutes) <input name="duration_minutes" type="number" min="1" required value="{{ values.duration_minutes|default('') }}"></label>
    <label>Event type
      <select id="event-type" name="event_type" required>
        <option value="">Choose one</option>
        {% for event_type in event_types %}
          <option value="{{ event_type.id }}"
                  data-price="{{ '%.2f'|format(event_type.price / 100) }}"
                  data-currency="{{ event_type.currency }}"
                  {% if values.event_type == event_type.id|string %}selected{% endif %}>{{ event_type.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Price <input id="price" name="price" type="number" min="0" step="0.01" required value="{{ values.price|default('') }}"></label>
    <label>Currency <input id="currency" name="currency" minlength="3" maxlength="3" required value="{{ values.currency|default('') }}"></label>
    <label>Comment <textarea name="comment">{{ values.comment|default('') }}</textarea></label>
    <button type="submit">Add event</button>
  </form>
  <script>
    document.getElementById("event-type").addEventListener("change", event => {
      const option = event.target.selectedOptions[0];
      if (!option || !option.dataset.price) return;
      document.getElementById("price").value = option.dataset.price;
      document.getElementById("currency").value = option.dataset.currency;
    });
  </script>
{% endblock %}
