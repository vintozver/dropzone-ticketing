{% extends "base.html" %}
{% block title %}Add event{% endblock %}
{% block content %}
  <h1>Add event</h1>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <div><label>Date <input name="date" type="date" required value="{{ values.date|default('') }}"></label></div>
    <div><label>Times (one per line) <textarea name="times" required placeholder="09:00&#10;11:30">{{ values.times|default('') }}</textarea></label></div>
    <div><label>Duration (minutes) <input name="duration_minutes" type="number" min="1" required value="{{ values.duration_minutes|default('') }}"></label></div>
    <div>
      <label>Event type
        <select id="event-type" name="event_type" required>
          <option value="">Choose one</option>
          {% for event_type in event_types %}
            <option value="{{ event_type.id }}"
                    data-price="{{ '%.2f'|format(event_type.price / 100) }}"
                    data-currency="{{ event_type.currency }}"
                    {% if values.event_type == event_type.id|string %}selected{% endif %}>{{ event_type.name }}</option>
          {% endfor %}
        </select>
      </label>
    </div>
    <div><label>Price <input id="price" name="price" type="number" min="0" step="0.01" required value="{{ values.price|default('') }}"></label></div>
    <div><label>Currency <input id="currency" name="currency" minlength="3" maxlength="3" required value="{{ values.currency|default('') }}"></label></div>
    <div><label>Comment <textarea name="comment">{{ values.comment|default('') }}</textarea></label></div>
    <button type="submit">Add event</button>
  </form>
  <script>
    $("#event-type").on("change", function () {
      const option = $(this).find(":selected");
      const price = option.attr("data-price");
      if (price === undefined) return;
      $("#price").val(price);
      $("#currency").val(option.attr("data-currency"));
    });
  </script>
{% endblock %}
