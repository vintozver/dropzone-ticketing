{% extends "base.html" %}
{% block title %}Tickets issued{% endblock %}
{% block content %}
  <h1>Tickets issued to {{ issued_to_display_name }}</h1>
  <ul>
    <li>Tickets issued: {{ count }}</li>
    <li>Purpose: {{ purpose }}</li>
    <li>Payment: {{ payment }}</li>
  </ul>
  <p><a href="{{ print_url }}">Download the tickets just issued as PDF</a></p>
{% endblock %}
