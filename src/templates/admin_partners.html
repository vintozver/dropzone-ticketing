{% extends "base.html" %}
{% block title %}Partners{% endblock %}
{% block content %}
<h1>Partners</h1>
<ul>{% for partner in partners %}<li><a href="/admin/partner/view/{{ partner.id }}">{{ partner.display_name }}</a></li>{% else %}<li>No partners.</li>{% endfor %}</ul>
<form method="post" action="/admin/partner/list">
  <label>Display name <input name="display_name" required></label>
  <button type="submit">Add partner</button>
</form>
{% endblock %}
