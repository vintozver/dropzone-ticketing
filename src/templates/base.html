<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}Dropzone ticketing{% endblock %}</title>
  </head>
  <body>
    <nav>
      <a href="/">Home</a>
      {% if not authenticated %}
        <a href="/authn">Sign in</a>
      {% endif %}
      <a href="/issue">Issue tickets</a>
      <a href="/redeem">Redeem tickets</a>
      <a href="/tickets">View tickets</a>
      {% if authenticated %}
        Signed in as <a href="/authn">{{ current_user_id }}</a>
      {% endif %}
    </nav>
    {% if registration_mode %}
      <section>
        <p>Registration-only mode is enabled.</p>
      </section>
    {% endif %}
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
