{% extends "base.html" %}
{% block title %}Create event{% endblock %}
{% block content %}
  <h1>Create event</h1>
  {% if error %}<p>{{ error }}</p>{% endif %}
  <form method="post">
    <label>Name <input name="name" type="text" required value="{{ name|default('') }}"></label>
    <label>Starts <input name="starts" type="datetime-local" required value="{{ starts|default('') }}"></label>
    <label>Capacity <input name="capacity" type="number" min="1" required value="{{ capacity|default('') }}"></label>
    <label>Description <textarea name="description">{{ description|default('') }}</textarea></label>
    <button type="submit">Create event</button>
  </form>
{% endblock %}
