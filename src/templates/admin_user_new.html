{% extends "base.html" %}
{% block title %}Add user{% endblock %}
{% block content %}
  <h1>Add user</h1>
  {% if error %}<p>{{ error }}</p>{% endif %}
  <form method="post">
    <label>Name <input name="name" type="text" maxlength="200" required value="{{ name|default('') }}"></label>
    <label>Email <input name="email" type="email" maxlength="320" required value="{{ email|default('') }}"></label>
    <label>Use email as
      <select name="identity_type" required>
        <option value="">Choose one</option>
        <option value="email" {% if identity_type == 'email' %}selected{% endif %}>Regular email with code validation</option>
        <option value="google" {% if identity_type == 'google' %}selected{% endif %}>Google</option>
        <option value="microsoft" {% if identity_type == 'microsoft' %}selected{% endif %}>Microsoft</option>
      </select>
    </label>
    <label>Role
      <select name="role" required>
        <option value="">Choose one</option>
        <option value="solo" {% if role == 'solo' %}selected{% endif %}>Solo</option>
        <option value="admin" {% if role == 'admin' %}selected{% endif %}>Administrator</option>
      </select>
    </label>
    <button type="submit">Add user</button>
  </form>
{% endblock %}
