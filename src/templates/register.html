{% extends "base.html" %}
{% block title %}Register FIDO2 credential{% endblock %}
{% block content %}
<h2>Register FIDO2 credential</h2>
<p>Registration mode is enabled. Authentication is disabled.</p>
<form id="authn-form" method="{% if registration_options %}post{% else %}get{% endif %}" action="/register">
  <label>Username <input name="username" id="username" value="{{ username }}" required {% if registration_options %}readonly{% endif %}></label>
  <input type="hidden" name="id" id="id">
  <input type="hidden" name="rawId" id="rawId">
  <input type="hidden" name="attestationObject" id="attestationObject">
  <input type="hidden" name="clientDataJSON" id="clientDataJSON">
  <button type="submit">Register credential</button>
</form>
<p id="authn-error" role="alert"></p>
<script>
const rpId = "{{ rp_id }}";
const registrationOptions = {{ registration_options | tojson }};
function decode(value) {
  const padded = value + "=".repeat((4 - value.length % 4) % 4);
  const binary = atob(padded.replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(binary, character => character.charCodeAt(0));
}
function encode(value) {
  const bytes = new Uint8Array(value);
  let binary = "";
  for (const byte of bytes) binary += String.fromCharCode(byte);
  return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
document.getElementById("authn-form").addEventListener("submit", async event => {
  if (!registrationOptions) return;
  event.preventDefault();
  try {
    const credential = await navigator.credentials.create({
      publicKey: Object.fromEntries(Object.entries(registrationOptions.publicKey).map(([key, value]) => {
        if (key === "challenge" || (key === "user" && value.id)) {
          if (key === "user") return [key, {...value, id: decode(value.id)}];
          return [key, decode(value)];
        }
        if (key === "excludeCredentials") return [key, value.map(credential => ({...credential, id: decode(credential.id)}))];
        return [key, value];
      }))
    });
    document.getElementById("id").value = credential.id;
    document.getElementById("rawId").value = encode(credential.rawId);
    document.getElementById("clientDataJSON").value = encode(credential.response.clientDataJSON);
    document.getElementById("attestationObject").value = encode(credential.response.attestationObject);
    event.target.submit();
  } catch (error) {
    document.getElementById("authn-error").textContent = "Registration failed. " + error;
  }
});
</script>
{% endblock %}
