{% extends "base.html" %}
{% block title %}Issue tickets{% endblock %}
{% block content %}
  <h1>Issue tickets</h1>
  {% if error %}<p>{{ error }}</p>{% endif %}
  <form method="post">
    <label>Owner <input name="owner" type="text" required value="{{ owner|default('') }}"></label>
    <label>Count <input name="count" type="number" min="1" max="1000" required></label>
    <button type="submit">Issue</button>
  </form>
{% endblock %}
