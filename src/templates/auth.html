{% extends "base.html" %}
{% block title %}Authenticate{% endblock %}
{% block content %}
{% if authenticated %}
{% include "auth_known.html" %}
{% else %}
{% include "auth_unknown.html" %}
{% endif %}
<script>
const challenge = "{{ challenge }}";
const rpId = "{{ rp_id }}";
const allowCredentials = {{ allow_credentials | tojson }};
const registrationOptions = {{ registration_options | tojson }};
document.querySelectorAll(".toggle-attestation").forEach(link => {
  link.addEventListener("click", event => {
    event.preventDefault();
    const details = link.closest("tr").nextElementSibling;
    details.hidden = !details.hidden;
  });
});
function decode(value) {
  const padded = value + "=".repeat((4 - value.length % 4) % 4);
  const binary = atob(padded.replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(binary, character => character.charCodeAt(0));
}
function encode(value) {
  const bytes = new Uint8Array(value);
  let binary = "";
  for (const byte of bytes) binary += String.fromCharCode(byte);
  return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
const authnForm = document.getElementById("authn-form");
if (authnForm) {
  authnForm.addEventListener("submit", async event => {
    event.preventDefault();
    try {
      const credential = await navigator.credentials.get({
         publicKey: {
           challenge: decode(challenge),
           rpId,
           allowCredentials: allowCredentials.map(id => ({type: "public-key", id: decode(id)})),
           timeout: 60000
         }
      });
      document.getElementById("id").value = credential.id;
      document.getElementById("rawId").value = encode(credential.rawId);
      document.getElementById("clientDataJSON").value = encode(credential.response.clientDataJSON);
      document.getElementById("authenticatorData").value = encode(credential.response.authenticatorData);
      document.getElementById("signature").value = encode(credential.response.signature);
      event.target.submit();
    } catch (error) {
      document.getElementById("authn-error").textContent = "Authentication failed.";
    }
  });
}
const registerForm = document.getElementById("register-form");
if (registerForm && registrationOptions) {
  registerForm.addEventListener("submit", async event => {
    event.preventDefault();
    try {
      const credential = await navigator.credentials.create({
        publicKey: Object.fromEntries(Object.entries(registrationOptions.publicKey).map(([key, value]) => {
          if (key === "challenge" || (key === "user" && value.id)) {
            if (key === "user") return [key, {...value, id: decode(value.id)}];
            return [key, decode(value)];
          }
          if (key === "excludeCredentials") return [key, value.map(item => ({...item, id: decode(item.id)}))];
          return [key, value];
        }))
      });
      document.getElementById("register-id").value = credential.id;
      document.getElementById("register-rawId").value = encode(credential.rawId);
      document.getElementById("register-clientDataJSON").value = encode(credential.response.clientDataJSON);
      document.getElementById("register-attestationObject").value = encode(credential.response.attestationObject);
      event.target.submit();
    } catch (error) {
      document.getElementById("register-error").textContent = "Registration failed.";
    }
  });
}
</script>
{% endblock %}
