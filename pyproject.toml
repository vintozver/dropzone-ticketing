[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dropzone-ticketing"
version = "0.1.0"
description = "Ticketing software for the drop zone (skydiving)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "jinja2>=3.1.6,<4",
    "reportlab>=4.2,<5",
    "mongoengine>=0.29,<1",
    "pymongo>=4,<5",
]

[tool.setuptools]
packages = ["dropzone_ticketing", "dropzone_ticketing.model"]
package-dir = {"dropzone_ticketing" = "src"}

[tool.setuptools.package-data]
dropzone_ticketing = ["logo.png", "templates/*.html"]
